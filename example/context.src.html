<title>Scenarios, views, and interiors</title>
<meta name="description" content="A shared hierarchy drives the stage and index.">
<style>
{{tokens}} {{fonts}} {{include:shell.css}}
.scene-nav{top:14px;left:14px;width:250px;max-height:calc(100% - 100px)}
.scene-nav .scroll{overflow:auto;padding:6px}
.card rect{fill:var(--md-sys-color-surface-container);stroke:var(--md-sys-color-outline);stroke-width:1.5}
.card text,.scope text{fill:var(--text);font:500 18px var(--font-sans)}
.scope rect{fill:none;stroke:var(--md-sys-color-outline);stroke-dasharray:6 5;stroke-width:1.5}
@media(max-width:820px){.scene-nav{display:none}}
</style>
<div class="titlebar"><h1>A service you can inspect</h1></div>
<div id="contexts"></div><div class="app">
  <svg class="stage" aria-label="System"><g><g id="content"></g></g></svg>
  <section class="hud scene-nav" data-nav><header><h2>Scene</h2></header><div class="scroll" data-nav-body></div></section>
  <section class="hud tools">
    <button class="btn" id="zoom-out" aria-label="Zoom out">{{icon:zoom_out:18}}</button>
    <button class="btn" id="zoom-in" aria-label="Zoom in">{{icon:zoom_in:18}}</button>
    <button class="btn" id="fit">{{icon:crop_free:18}}Fit</button>
  </section>
</div>
<div class="status"><span class="cell" id="st-zoom"></span><span class="cell" id="st-sel">nothing selected</span><span class="cell" id="st-hint">Enter opens the selected object's own interior.</span></div>
<script>
{{include:motion.js}}
{{include:stage.js}}
{{include:model.js}}
{{include:context.js}}
const svg = document.querySelector('svg.stage'), content = document.querySelector('#content');
function box(x,y,width=280,height=150,scope=false){
  return (g,item) => {
    g.setAttribute('class',scope?'scope':'card');
    const rect = document.createElementNS(svg.namespaceURI,'rect');
    for (const [key,value] of Object.entries({x,y,width,height,rx:12})) rect.setAttribute(key,value);
    const text = document.createElementNS(svg.namespaceURI,'text');
    text.setAttribute('x',x+18); text.setAttribute('y',y+(scope?32:90)); text.textContent=item.label;
    g.append(rect,text);
  };
}
let failBuild=false;
function build(context){
  const {settings:s,view}=context, flow=view==='flow';
  const state=!s.online?'Asleep':s.key?'Connected':'Key missing';
  const detail={id:'worker-detail',label:'Worker',items:[
    {id:'socket',label:`Socket: ${state}`,draw:failBuild?()=>{}:box(40,80)},
  ]};
  const inside={id:'server-interior',label:'Server',items:[
    {id:'worker',label:`Worker: ${state}`,draw:box(40,80),interior:flow?detail:null},
    {id:'access',label:s.key?'Access granted':'Access denied',draw:box(flow?380:40,flow?80:300)},
  ]};
  return {id:'system',label:'System',items:[
    {id:'client',label:flow?'Client request':'Client identity',draw:box(40,80)},
    ...(s.installed?[{id:'server',label:`Server: ${state}`,draw:box(flow?380:40,flow?80:300),interior:inside}]:[]),
  ]};
}
const stage=createContextStage({svg,content,controls:document.querySelector('#contexts'),
  defaults:{online:true,key:true,installed:true},
  scenarios:[
    {id:'ready',label:'Ready',mode:'replace',values:{}},
    {id:'no-key',label:'Key missing',mode:'replace',values:{key:false}},
    {id:'asleep',label:'Put to sleep',mode:'patch',values:{online:false}},
    {id:'absent',label:'Server absent',mode:'replace',values:{installed:false}},
  ],
  views:[{id:'flow',label:'Request flow'},{id:'inventory',label:'Inventory'}],
  initialScenario:'ready',build,
});
window.demo={stage,fail(value){failBuild=value;}};
stage.fit();
</script>
