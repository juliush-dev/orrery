<title>A model with interiors</title>
<meta name="description" content="A shared hierarchy drives the stage and index.">
<style>
{{tokens}} {{fonts}} {{include:shell.css}}
.scene-nav{top:14px;left:14px;width:250px;max-height:calc(100% - 100px)}
.scene-nav .scroll{overflow:auto;padding:6px}
.model-notes{top:14px;right:14px;width:320px;max-height:calc(100% - 96px);display:flex;flex-direction:column}
.model-notes .scroll{padding:14px 16px;font-size:13.5px;line-height:1.6}
@media(max-width:820px){.model-notes{top:auto;left:10px;right:10px;bottom:14px;width:auto;max-height:44%}}
.card rect{fill:var(--md-sys-color-surface-container);stroke:var(--md-sys-color-outline);stroke-width:1.5}
.card text,.scope text{fill:var(--text);font:500 18px var(--font-sans)}
.scope rect{fill:none;stroke:var(--md-sys-color-outline);stroke-dasharray:6 5;stroke-width:1.5}
@media(max-width:820px){.scene-nav{display:none}}
</style>
<div class="titlebar"><h1>A model with interiors</h1></div>
<div class="app">
  <svg class="stage" aria-label="System"><g><g id="content"></g></g></svg>
  <section class="hud scene-nav" data-nav><header><h2>Scene</h2></header><div class="scroll" data-nav-body></div></section>
  <section class="hud model-notes" data-expandable aria-label="Reading">
    <header><h2>Reading</h2></header>
    <div class="scroll"><p>Explore a component with Enter. The scene and navigator follow the same hierarchy.</p>
      <p>Center this reader to bring the navigator alongside it. Returning the reader to the side restores both panels.</p></div>
  </section>
  <section class="hud tools">
    <button class="btn" id="zoom-out" aria-label="Zoom out">{{icon:zoom_out:18}}</button>
    <button class="btn" id="zoom-in" aria-label="Zoom in">{{icon:zoom_in:18}}</button>
    <button class="btn" id="fit">{{icon:crop_free:18}}Fit</button>
  </section>
</div>
<div class="status"><span class="cell" id="st-zoom"></span><span class="cell" id="st-sel">nothing selected</span><span class="cell" id="st-hint">Enter opens the selected object's own interior.</span></div>
<script>
{{include:motion.js}}
{{include:stage.js}}
{{include:model.js}}
const svg = document.querySelector('svg.stage'), content = document.querySelector('#content');
function box(x,y,width=240,height=150,scope=false){
  return (g,item) => {
    g.setAttribute('class',scope?'scope':'card');
    const rect = document.createElementNS(svg.namespaceURI,'rect');
    // data-face is the box the kit pins this object's Enter mark to: the shape
    // the reader recognises as the object, not everything drawn in its group.
    rect.setAttribute('data-face','');
    for (const [key,value] of Object.entries({x,y,width,height,rx:12})) rect.setAttribute(key,value);
    const text = document.createElementNS(svg.namespaceURI,'text');
    text.setAttribute('x',x+18); text.setAttribute('y',y+(scope?32:90)); text.textContent=item.label;
    g.append(rect,text);
  };
}
const server = {id:'server-interior',label:'Server',items:[
  {id:'ssh',label:'SSH',draw:box(40,80)},
  {id:'loopback',label:'Loopback',draw:box(340,80,340,300,true),children:[
    {id:'worker',label:'Worker',draw:box(370,180,280,150)},
  ]},
]};
const workstation = {id:'workstation-interior',label:'Workstation',items:[
  {id:'editor',label:'Editor',draw:box(40,80)},
  {id:'terminal',label:'Terminal',draw:box(340,80)},
]};
const model = {id:'system',label:'System',items:[
  {id:'server',label:'Server',draw:box(40,80),interior:server},
  {id:'workstation',label:'Workstation',draw:box(340,80),interior:workstation},
  {id:'notes',label:'Notes',draw:box(640,80)},
]};
const stage = createModelStage({svg,content,model});
window.demo = {stage,model,server,workstation};
stage.fit();
</script>
