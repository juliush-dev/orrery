<title>Example</title>
<meta name="description" content="The smallest possible Orrery app.">
<style>
{{tokens}}
{{fonts}}
{{include:shell.css}}

.notes{top:14px;right:14px;width:320px;max-height:calc(100% - 96px);display:flex;
  flex-direction:column}
.notes .scroll{padding:14px 16px 16px}
.notes h3{font:600 17px/1.3 var(--font-sans);margin:0 0 8px}
.notes p{margin:0 0 10px;font-size:13.5px;line-height:1.6}
.notes p.quiet{color:var(--text-muted)}
@media (max-width:820px){
  .notes{top:auto;left:10px;right:10px;bottom:66px;width:auto;max-height:44%}
  .titlebar .sub{display:none}
}
.box rect{fill:var(--md-sys-color-surface-container-low);stroke:var(--md-sys-color-outline-variant);
  stroke-width:1.5;transition:stroke var(--dur-med) var(--ease-standard),
  fill var(--dur-med) var(--ease-standard)}
.box{cursor:pointer;color:var(--md-sys-color-on-surface-variant);
  transition:opacity var(--dur-med) var(--ease-standard)}
.box:hover rect{stroke:var(--md-sys-color-outline)}
.box.sel rect{stroke:var(--md-sys-color-primary);stroke-width:2.6;
  fill:color-mix(in srgb,var(--md-sys-color-primary-container) 45%,var(--md-sys-color-surface))}
.box.sel{color:var(--md-sys-color-primary)}
.box:focus-visible rect{stroke:var(--md-sys-color-primary);stroke-width:2.6;filter:var(--focus-glow)}
.b-title{fill:var(--md-sys-color-on-surface);font:600 16px var(--font-sans)}
.b-sub{fill:var(--md-sys-color-on-surface-variant);font:400 12.5px var(--font-mono)}
</style>

<div class="titlebar">
  <span class="brand">{{icon:hub:20}}</span>
  <h1>example</h1>
  <span class="sub">the smallest orrery</span>
</div>

<div class="app">
<svg id="stage" class="stage" role="application" aria-label="Three objects on a stage.">
  <defs>
    <pattern id="grid-p" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="var(--grid-line)" stroke-width="1"
            vector-effect="non-scaling-stroke"/>
    </pattern>
  </defs>
  <g id="world">
    <rect x="-6000" y="-6000" width="14000" height="14000" fill="url(#grid-p)"/>
    <g id="content"></g>
  </g>
</svg>

<section class="hud notes" data-expandable aria-label="Notes">
  <header>{{icon:info:16}}<h2>Notes</h2></header>
  <div class="scroll" id="notes"></div>
</section>

<section class="hud tools" aria-label="View">
  <button type="button" class="btn" id="zoom-out" aria-label="Zoom out">{{icon:zoom_out:18}}</button>
  <button type="button" class="btn" id="zoom-in" aria-label="Zoom in">{{icon:zoom_in:18}}</button>
  <button type="button" class="btn" id="fit">{{icon:crop_free:18}}Fit</button>
</section>
</div>

<div class="status">
  <span class="cell">3 objects</span>
  <span class="cell">{{icon:zoom_in:14}}<span id="st-zoom">zoom 100%</span></span>
  <span class="cell" id="st-hint">swipe to pan, pinch to zoom, double-click to frame</span>
</div>

<script>
{{include:motion.js}}
{{include:stage.js}}

const DATA = [
  {id:'alpha', title:'Alpha', sub:'an object', note:'Objects are plain SVG. The kit only needs a selector to know which ones are pickable.'},
  {id:'beta',  title:'Beta',  sub:'another',   note:'Selection, framing, panning, pinch, swipe, text selection and the focus ring all came for free.'},
  {id:'gamma', title:'Gamma', sub:'a third',   note:'Everything visible here is a token. Change the seed in orrery.config.json and the whole thing re-tones.'},
];

const svg = document.getElementById('stage');
const content = document.getElementById('content');
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

DATA.forEach((d, i) => {
  const x = 60 + i * 300, y = 60;
  const g = el('g', {class:'box', id:'o-' + d.id, tabindex:'0', role:'button'});
  g.setAttribute('aria-label', d.title);
  g.appendChild(el('rect', {x, y, width:240, height:120, rx:14}));
  const t = el('text', {class:'b-title', x:x + 20, y:y + 44}); t.textContent = d.title;
  const s = el('text', {class:'b-sub', x:x + 20, y:y + 70}); s.textContent = d.sub;
  g.append(t, s);
  content.appendChild(g);
});

const notes = document.getElementById('notes');
const IDLE = '<p class="quiet">Pick an object. Everything the stage does — camera, picking, ' +
             'the interaction laws — comes from the kit; this file only draws three rectangles.</p>';

const stage = createStage({
  svg, content,
  objects: 'g.box',
  onPick: el => {
    content.querySelectorAll('g.box').forEach(g => g.classList.toggle('sel', g === el));
    if (!el) return swapIn(notes, IDLE);
    const d = DATA.find(x => 'o-' + x.id === el.id);
    swapIn(notes, `<h3>${d.title}</h3><p>${d.note}</p>`);
  },
});

notes.innerHTML = IDLE;
stage.fit();
revealAll([...content.querySelectorAll('g.box')], 40);
</script>
